name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:        # erlaubt manuelles Starten über den Actions-Tab

permissions:
  contents: read
  pages: write
  id-token: write

# Verhindert genau den Stau, der dich blockiert hat:
# Ein neuer Deploy bricht den laufenden ab, statt sich dahinter anzustellen.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Dateien als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'          # gesamtes Repo-Root (thein.html, sw.js, manifest, icons)

      - name: Deployen
        id: deployment
        uses: actions/deploy-pages@v4
